# Wheel/rail inspection rig, devices placed directly in the TRACK frame
# (x along track, y left, z up, metres; origin on the centreline at top of rail).
# The wheel stands on the right rail (y < 0); the rig looks from the field side (more -y).
# Aim points: see synthrig.assets.wheelrail.key_points (tread contact ~ [0, -0.746, 0]).
# Example layout, not a design: edit freely (or in the GUI).
name: wheel_rail_v1
version: 1
frame: track
description: >
  Example: mono stereo pair + two colour side cameras on the field side, one line laser
  across the tread/flange and rail head, one dot-pattern laser.

cameras:
  - name: cam0                      # stereo left (smaller x = image left when looking +y)
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [-0.06, -1.45, 0.30], look_at: [0.0, -0.75, 0.05]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam1                      # stereo right
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.06, -1.45, 0.30], look_at: [0.0, -0.75, 0.05]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam2                      # side camera, upstream
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 40}
    distortion: [-0.10, 0.04, 0.0, 0.0, 0.0]
    pose: {position: [-0.55, -1.30, 0.20], look_at: [0.0, -0.75, 0.10]}
    sensor: {mono: false, bayer: RGGB, rgb_response: [1.0, 1.0, 1.0], bit_depth: 12, exposure: 1.0}
  - name: cam3                      # side camera, downstream
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 40}
    distortion: [-0.10, 0.04, 0.0, 0.0, 0.0]
    pose: {position: [0.55, -1.30, 0.20], look_at: [0.0, -0.75, 0.10]}
    sensor: {mono: false, bayer: RGGB, rgb_response: [1.0, 1.0, 1.0], bit_depth: 12, exposure: 1.0}

stereo_pairs:
  - {name: front, left: cam0, right: cam1, alpha: 0.0}

lasers:
  - name: red_line                  # light sheet in the x = 0 plane: a profile line
    wavelength_nm: 650
    pose: {position: [0.0, -1.20, 0.55], look_at: [0.0, -0.75, 0.0]}
    pattern: {type: line, fan_deg: 40, angle_deg: 90}
    power_w: 400
    dot_sigma_mrad: 0.6
  - name: green_dots
    wavelength_nm: 520
    pose: {position: [0.25, -1.40, 0.45], look_at: [0.0, -0.75, 0.05]}
    pattern: {type: grid, rows: 15, cols: 21, fan_deg: [24, 16]}
    power_w: 250
    dot_sigma_mrad: 0.6

lights:
  - name: strobe
    type: area
    pose: {position: [0.0, -1.55, 0.45], look_at: [0.0, -0.75, 0.1]}
    power_w: 4
    size_m: 0.2
