# Optional. Copy to infra/config.yaml (gitignored) to override the defaults in
# infra/cloud.py. Never put credentials here. Unknown keys and "<...>" placeholders
# are rejected, so delete any line you do not fill in.

# Without this file: data_root = $SYNTHRIG_DATA_ROOT or ../data, scratch_dir =
# <data_root>/scratch, docker_root = what `docker info` reports (local workstation).
# The values below are the EC2 instance's; infra/ec2/setup_host.sh writes them there.
data_root: /app/synthrig      # persistent EBS volume: datasets/, previews/, logs/, diagnostics/
scratch_dir: /scratch         # instance-store NVMe: render scratch, ERASED on stop/start
docker_root: /app/docker      # Docker data-root (images); only used by `cloud.py disk`
image: synthrig               # local Docker image name (tag :latest + :<git sha>)
min_free_gb: 20               # renders refuse to start, and workers stop, below this
max_parallel_shards: 2        # worker containers sharing the one GPU before a warning

# Used only by `python -m infra.access_check <instance-id>` from a laptop.
# region: us-east-1
# aws_profile: default
# instance_id: i-0123456789abcdef0
# owner: team@example.com
