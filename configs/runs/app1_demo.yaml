# Application 1 run: rig + scene + frame count -> dataset
rig: ../rigs/demo_4cam_2laser.yaml       # relative to this file
scene: scenes.app1:ClutterScene
scene_params: {}                          # fixed overrides of sampled params, e.g. {ambient: 0.1}
output: out/app1_demo
frames: 4
seed: 1234
render:
  samples: 64
  render_scale: 1.0          # 0.25 for quick previews
  filter_width: 1.5
  max_bounces: 4
  device: CPU
outputs:
  save_radiance: true
  save_laser_components: true
  laser_mask_threshold: 0.02
calib_perturbation:
  enabled: true
  seed: 7
  rotation_deg: 0.05
  translation_mm: 0.2
  focal_pct: 0.1
  principal_px: 0.5
