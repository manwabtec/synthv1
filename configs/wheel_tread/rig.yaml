# wheel_tread layout, devices in the TRACK frame (x along track, y left, z up, metres).
# The wheel stands on the right rail (y < 0) at x = 0; rail top is z = 0.
# Two camera rods (one stereo pair each) run parallel to the rail (along x), just above rail-top height, ahead
# of the wheel, looking up at the tread 2.5 in (64 mm) above the rail (x = 0.232):
#   field side (outside the rail, rim side):  cam0/cam1 on y = -0.95, green dot laser above
#   gauge side (inside the rail, flange side): cam2/cam3 on y = -0.55, red line laser above
# The rod length is the camera spacing; edit it with the GUI's rod sliders.
# Example layout, not a design.
name: wheel_tread_pairs_v1
version: 1
frame: track
description: >
  Two camera rods (field side and gauge side) just above rail height ahead of the wheel,
  all four cameras looking up at the same tread region 64 mm above the rail; a green dot
  laser above the field rod, a red line laser above the gauge rod.

cameras:
  - name: cam0                      # field rod, near end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 50.2}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.4125, -0.888, 0.01], look_at: [0.536, -0.7611, 0.076]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam1                      # field rod, far end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 50.2}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.6135, -0.888, 0.01], look_at: [0.536, -0.7611, 0.076]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam2                      # gauge rod, far end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 58.8}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.588, -0.601, -0.049], look_at: [0.5043, -0.7456, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam3                      # gauge rod, near end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 58.8}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.438, -0.601, -0.049], look_at: [0.5043, -0.7456, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}

# One stereo pair per rod (the GUI's pair sliders move a rod's cameras together).
# rectify: false = raw images + calib/pair_<name>.yml (R, T) for your own stereo code:
# the cameras converge strongly on a nearby spot, so standard rectification is
# ill-conditioned here.
stereo_pairs:
  - {name: field, left: cam0, right: cam1, rectify: false}
  - {name: gauge, left: cam3, right: cam2, rectify: false}

lasers:
  - name: green_dots                # field side, above the field rod
    wavelength_nm: 520
    pose: {position: [0.491, -0.92, 0.018], look_at: [0.5337, -0.7466, 0.0825]}
    pattern: {type: grid, rows: 25, cols: 25, fan_deg: [35, 35]}
    power_w: 35.0
    dot_sigma_mrad: 0.5
  - name: red_line                  # gauge side, above the gauge rod
    wavelength_nm: 650
    pose: {position: [0.536, -0.523, -0.038], look_at: [0.558, -0.7331, 0.0635]}
    pattern: {type: grid, rows: 25, cols: 25, fan_deg: [40, 40]}
    power_w: 10.0
    dot_sigma_mrad: 0.5

lights:
  - name: strobe_field
    type: area
    pose: {position: [0.50, -1.00, 0.08], look_at: [0.2324, -0.7462, 0.0635]}
    power_w: 1.5
    size_m: 0.12
  - name: strobe_gauge
    type: area
    pose: {position: [0.50, -0.50, 0.08], look_at: [0.2324, -0.705, 0.0635]}
    power_w: 1.5
    size_m: 0.12
