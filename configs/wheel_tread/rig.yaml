# wheel_tread layout, devices in the TRACK frame (x along track, y left, z up, metres).
# The wheel stands on the right rail (y < 0) at x = 0. Everything sits low on the field
# side, ahead of the wheel (x > 0), looking back at the tread 45 deg ahead of the contact
# point: tread target [0.323, -0.746, 0.134]. Rail occupies |y| 0.68..0.83 near z <= 0,
# so devices stay at y <= -0.9. Example layout, not a design: edit freely (or in the GUI).
name: wheel_tread_v1
version: 1
frame: track
description: >
  Example: mono stereo pair (5 cm half-baseline, horizontal) and two colour cameras ahead of
  and behind the wheel, a line laser drawing a tread/flange profile, a dot-pattern laser.

cameras:
  - name: cam0                      # stereo left
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 24}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.7285, -0.9951, 0.02], look_at: [0.3233, -0.7462, 0.1339]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam1                      # stereo right
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 24}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.7715, -0.9049, 0.02], look_at: [0.3233, -0.7462, 0.1339]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam2                      # colour, ahead and higher
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.08, 0.03, 0.0, 0.0, 0.0]
    pose: {position: [0.80, -1.15, 0.25], look_at: [0.3233, -0.7462, 0.1339]}
    sensor: {mono: false, bayer: RGGB, rgb_response: [1.0, 1.0, 1.0], bit_depth: 12, exposure: 1.0}
  - name: cam3                      # colour, behind the wheel (mirror of the stereo pair)
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.08, 0.03, 0.0, 0.0, 0.0]
    pose: {position: [-0.75, -0.95, 0.02], look_at: [-0.3233, -0.7462, 0.1339]}
    sensor: {mono: false, bayer: RGGB, rgb_response: [1.0, 1.0, 1.0], bit_depth: 12, exposure: 1.0}

stereo_pairs:
  - {name: front, left: cam0, right: cam1, alpha: 0.0}

lasers:
  - name: red_line                  # light sheet across the tread: a tread/flange profile line
    wavelength_nm: 650
    pose: {position: [0.62, -0.95, -0.02], look_at: [0.3233, -0.7462, 0.1339]}
    pattern: {type: line, fan_deg: 30, angle_deg: 0}
    power_w: 150
    dot_sigma_mrad: 0.5
  - name: green_dots
    wavelength_nm: 520
    pose: {position: [0.75, -1.05, 0.12], look_at: [0.3233, -0.7462, 0.1339]}
    pattern: {type: grid, rows: 11, cols: 15, fan_deg: [14, 10]}
    power_w: 120
    dot_sigma_mrad: 0.5

lights:
  - name: strobe
    type: area
    pose: {position: [0.85, -1.05, 0.10], look_at: [0.3233, -0.7462, 0.1339]}
    power_w: 2
    size_m: 0.15
