# wheel_tread layout, devices in the TRACK frame (x along track, y left, z up, metres).
# The wheel stands on the right rail (y < 0) at x = 0; rail top is z = 0.
# Two camera rods run parallel to the rail (along x), just above rail-top height, ahead
# of the wheel, looking up at the tread 2.5 in (64 mm) above the rail (x = 0.232):
#   field side (outside the rail, rim side):  cam0/cam1 on y = -0.95, green dot laser above
#   gauge side (inside the rail, flange side): cam2/cam3 on y = -0.55, red line laser above
# The rod length is the camera spacing; edit it with the GUI's rod sliders.
# Example layout, not a design.
name: wheel_tread_rods_v1
version: 1
frame: track
description: >
  Two camera rods (field side and gauge side) just above rail height ahead of the wheel,
  all four cameras looking up at the same tread region 64 mm above the rail; a green dot
  laser above the field rod, a red line laser above the gauge rod.

cameras:
  - name: cam0                      # field rod, near end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.35, -0.95, 0.01], look_at: [0.2324, -0.7462, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam1                      # field rod, far end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.65, -0.95, 0.01], look_at: [0.2324, -0.7462, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam2                      # gauge rod, far end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.65, -0.55, 0.01], look_at: [0.2324, -0.705, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}
  - name: cam3                      # gauge rod, near end
    intrinsics: {width: 1936, height: 1216, pixel_size_um: 5.86, hfov_deg: 30}
    distortion: [-0.05, 0.02, 0.0, 0.0, 0.0]
    pose: {position: [0.35, -0.55, 0.01], look_at: [0.2324, -0.705, 0.0635]}
    sensor:
      mono: true
      bit_depth: 12
      full_well_e: 10000
      read_noise_e: 3.0
      exposure: 1.0
      bloom: {enabled: true, fraction: 0.3, sigma_px: 1.5}

# Rods: cameras on one bar along the rail (the GUI's rod sliders move them together).
# No stereo_pairs: with the cameras spread along the rail and converging on one nearby
# spot, the baseline runs almost along a line of sight, so standard rectification is
# ill-conditioned. Add pairs only for side-by-side cameras.
rods:
  - {name: field, cameras: [cam0, cam1]}
  - {name: gauge, cameras: [cam2, cam3]}

lasers:
  - name: green_dots                # field side, above the field rod
    wavelength_nm: 520
    pose: {position: [0.50, -0.95, 0.15], look_at: [0.2324, -0.7462, 0.0635]}
    pattern: {type: grid, rows: 11, cols: 15, fan_deg: [14, 10]}
    power_w: 100
    dot_sigma_mrad: 0.5
  - name: red_line                  # gauge side, above the gauge rod
    wavelength_nm: 650
    pose: {position: [0.50, -0.55, 0.15], look_at: [0.2324, -0.705, 0.0635]}
    pattern: {type: line, fan_deg: 30, angle_deg: 0}
    power_w: 150
    dot_sigma_mrad: 0.5

lights:
  - name: strobe_field
    type: area
    pose: {position: [0.50, -1.00, 0.08], look_at: [0.2324, -0.7462, 0.0635]}
    power_w: 1.5
    size_m: 0.12
  - name: strobe_gauge
    type: area
    pose: {position: [0.50, -0.50, 0.08], look_at: [0.2324, -0.705, 0.0635]}
    power_w: 1.5
    size_m: 0.12
